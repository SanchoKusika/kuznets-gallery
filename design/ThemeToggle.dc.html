<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ isScene }}" hint-placeholder-val="{{ true }}">
  <button type="button" onClick="{{ toggle }}" role="switch" aria-checked="{{ checked }}" aria-label="{{ aria }}" title="{{ aria }}" style="box-sizing:border-box; position:relative; display:block; width:56px; height:30px; flex:none; padding:0; border:0; border-radius:99px; overflow:hidden; isolation:isolate; cursor:pointer; background:{{ sky }}; box-shadow:inset 0 1.5px 4px rgba(0,0,0,.28), inset 0 0 0 1px rgba(0,0,0,.08); transition:background-color .6s cubic-bezier(.2,.7,.2,1), filter .3s, transform .25s cubic-bezier(.2,.7,.2,1); -webkit-tap-highlight-color:transparent" style-hover="filter:brightness(1.08)" style-active="transform:scale(.95)">
    <svg width="56" height="30" viewBox="0 0 70 38" preserveAspectRatio="none" style="position:absolute; left:0; top:0; display:block; pointer-events:none; opacity:{{ nightOp }}; transform:translateY({{ starsY }}); transition:opacity .5s, transform .7s cubic-bezier(.2,.7,.2,1)">
      <path d="M11 7.5l.9 2.7 2.7.9-2.7.9-.9 2.7-.9-2.7-2.7-.9 2.7-.9z" fill="#fff"></path>
      <path d="M24.5 20.5l.6 1.8 1.8.6-1.8.6-.6 1.8-.6-1.8-1.8-.6 1.8-.6z" fill="#fff" opacity=".9"></path>
      <circle cx="20" cy="8.5" r=".9" fill="#fff"></circle>
      <circle cx="6.5" cy="21" r="1.1" fill="#fff" opacity=".85"></circle>
      <circle cx="14.5" cy="28" r=".8" fill="#fff" opacity=".7"></circle>
      <circle cx="28.5" cy="11.5" r=".7" fill="#fff" opacity=".6"></circle>
      <circle cx="30.5" cy="30" r=".9" fill="#fff" opacity=".75"></circle>
      <circle cx="16.5" cy="17.5" r=".6" fill="#fff" opacity=".6"></circle>
    </svg>
    <svg width="56" height="30" viewBox="0 0 70 38" preserveAspectRatio="none" style="position:absolute; left:0; top:0; display:block; pointer-events:none; opacity:{{ dayOp }}; transform:translateY({{ cloudsY }}); transition:opacity .5s, transform .7s cubic-bezier(.2,.7,.2,1)">
      <g fill="#fff" opacity=".55"><circle cx="46" cy="30" r="7"></circle><circle cx="55" cy="25" r="8"></circle><circle cx="65" cy="24" r="9"></circle><circle cx="75" cy="20" r="10"></circle></g>
      <g fill="#fff"><circle cx="41" cy="37" r="7"></circle><circle cx="50" cy="33.5" r="7.5"></circle><circle cx="60" cy="32" r="8"></circle><circle cx="70" cy="29" r="9"></circle></g>
    </svg>
    <span style="position:absolute; left:3px; top:3px; width:24px; height:24px; border-radius:50%; overflow:hidden; background:#F2B93B; box-shadow:{{ knobShadow }}; transform:translateX({{ knobX }}); transition:transform .6s cubic-bezier(.2,.7,.2,1), box-shadow .6s">
      <span style="position:absolute; inset:0; border-radius:50%; background:#D9D5CC; box-shadow:inset -1.5px -2px 4px rgba(0,0,0,.22), inset 1.5px 1.5px 2px rgba(255,255,255,.35); transform:translateX({{ moonX }}); transition:transform .6s cubic-bezier(.2,.7,.2,1)">
        <span style="position:absolute; left:16.7%; top:40%; width:33.3%; height:33.3%; border-radius:50%; background:#B6B1A7; box-shadow:inset 1px 1.5px 2px rgba(0,0,0,.25)"></span>
        <span style="position:absolute; left:53.3%; top:16.7%; width:23.3%; height:23.3%; border-radius:50%; background:#B6B1A7; box-shadow:inset 1px 1px 1.5px rgba(0,0,0,.22)"></span>
        <span style="position:absolute; left:60%; top:60%; width:16.7%; height:16.7%; border-radius:50%; background:#B6B1A7; box-shadow:inset .5px 1px 1px rgba(0,0,0,.22)"></span>
      </span>
    </span>
  </button>
</sc-if>

<sc-if value="{{ isLabel }}" hint-placeholder-val="{{ false }}">
  <button type="button" onClick="{{ toggle }}" role="switch" aria-checked="{{ checked }}" aria-label="{{ aria }}" title="{{ aria }}" style="box-sizing:border-box; position:relative; display:block; width:94px; height:38px; flex:none; padding:0; border:1px solid var(--kz-line3,rgba(21,21,21,.25)); border-radius:99px; overflow:hidden; background:transparent; color:var(--kz-ink,#151515); cursor:pointer; transition:border-color .25s, transform .25s cubic-bezier(.2,.7,.2,1); -webkit-tap-highlight-color:transparent" style-hover="border-color:var(--kz-ink,#151515)" style-active="transform:scale(.96)">
    <span style="position:absolute; right:14px; top:0; bottom:0; display:flex; align-items:center; font-family:Onest, sans-serif; font-variant-numeric:tabular-nums; font-size:11px; letter-spacing:.1em; text-transform:uppercase; opacity:{{ dayOp }}; transform:translateX({{ dayLblX }}); transition:opacity .35s, transform .55s cubic-bezier(.2,.7,.2,1); font-weight:500">День</span>
    <span style="position:absolute; left:14px; top:0; bottom:0; display:flex; align-items:center; font-family:Onest, sans-serif; font-variant-numeric:tabular-nums; font-size:11px; letter-spacing:.1em; text-transform:uppercase; opacity:{{ nightOp }}; transform:translateX({{ nightLblX }}); transition:opacity .35s, transform .55s cubic-bezier(.2,.7,.2,1); font-weight:500">Ночь</span>
    <span style="position:absolute; left:4px; top:4px; width:28px; height:28px; border-radius:50%; background:{{ lblKnobBg }}; color:{{ lblKnobFg }}; transform:translateX({{ lblKnobX }}); transition:transform .55s cubic-bezier(.2,.7,.2,1), background-color .45s, color .45s">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="position:absolute; left:6px; top:6px; display:block; opacity:{{ dayOp }}; transform:{{ sunT }}; transition:opacity .3s, transform .55s cubic-bezier(.2,.7,.2,1)"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="position:absolute; left:6px; top:6px; display:block; opacity:{{ nightOp }}; transform:{{ moonT }}; transition:opacity .3s, transform .55s cubic-bezier(.2,.7,.2,1)"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg>
    </span>
  </button>
</sc-if>

<sc-if value="{{ isSeg }}" hint-placeholder-val="{{ false }}">
  <div role="radiogroup" aria-label="Тема оформления" style="box-sizing:border-box; position:relative; display:flex; height:38px; flex:none; padding:3px; border:1px solid var(--kz-line3,rgba(21,21,21,.25)); border-radius:99px">
    <span style="position:absolute; left:3px; top:3px; width:34px; height:30px; border-radius:99px; background:var(--kz-ink,#151515); transform:translateX({{ segX }}); transition:transform .45s cubic-bezier(.2,.7,.2,1)"></span>
    <button type="button" role="radio" aria-checked="{{ notChecked }}" aria-label="Светлая тема" title="Светлая тема" onClick="{{ pickLight }}" style="position:relative; width:34px; height:30px; padding:0; border:0; border-radius:99px; background:transparent; color:{{ segSunFg }}; opacity:{{ segSunOp }}; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:color .35s, opacity .25s; -webkit-tap-highlight-color:transparent" style-hover="opacity:1"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="display:block"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></button>
    <button type="button" role="radio" aria-checked="{{ checked }}" aria-label="Тёмная тема" title="Тёмная тема" onClick="{{ pickDark }}" style="position:relative; width:34px; height:30px; padding:0; border:0; border-radius:99px; background:transparent; color:{{ segMoonFg }}; opacity:{{ segMoonOp }}; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:color .35s, opacity .25s; -webkit-tap-highlight-color:transparent" style-hover="opacity:1"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg></button>
  </div>
</sc-if>

<sc-if value="{{ isIcon }}" hint-placeholder-val="{{ false }}">
  <button type="button" onClick="{{ toggle }}" role="switch" aria-checked="{{ checked }}" aria-label="{{ aria }}" title="{{ aria }}" style="box-sizing:border-box; width:38px; height:38px; flex:none; padding:0; border-radius:50%; border:1px solid var(--kz-line3,rgba(21,21,21,.25)); background:transparent; color:var(--kz-ink,#151515); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:border-color .25s, transform .25s cubic-bezier(.2,.7,.2,1); -webkit-tap-highlight-color:transparent" style-hover="border-color:var(--kz-ink,#151515)" style-active="transform:scale(.92)">
    <svg width="18" height="18" viewBox="0 0 24 24" style="display:block; overflow:visible">
      <mask id="{{ maskId }}"><rect x="-4" y="-4" width="32" height="32" fill="#fff"></rect><circle cx="17.5" cy="6.5" r="7" fill="#000" style="transform:translate({{ maskT }}); transition:transform .6s cubic-bezier(.2,.7,.2,1)"></circle></mask>
      <circle cx="12" cy="12" r="8.5" fill="currentColor" mask="{{ maskUrl }}" style="transform-origin:12px 12px; transform:scale({{ coreS }}); transition:transform .6s cubic-bezier(.2,.7,.2,1)"></circle>
      <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="transform-origin:12px 12px; transform:{{ raysT }}; opacity:{{ dayOp }}; transition:transform .6s cubic-bezier(.2,.7,.2,1), opacity .35s"><path d="M12 1.6v2.2M12 20.2v2.2M1.6 12h2.2M20.2 12h2.2M4.65 4.65l1.55 1.55M17.8 17.8l1.55 1.55M4.65 19.35l1.55-1.55M17.8 6.2l1.55-1.55"></path></g>
    </svg>
  </button>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;220px&quot;,&quot;height&quot;:&quot;90px&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;scene&quot;,&quot;label&quot;,&quot;segmented&quot;,&quot;icon&quot;],&quot;default&quot;:&quot;scene&quot;,&quot;tsType&quot;:&quot;'scene'|'label'|'segmented'|'icon'&quot;},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onToggle&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(origin: { clientX: number; clientY: number }) =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { d: null };
  uid = 'kztt' + Math.random().toString(36).slice(2, 8);
  componentDidUpdate(pp) { if (pp.dark !== this.props.dark && this.state.d !== null) this.setState({ d: null }); }
  isDark() { return this.props.onToggle ? !!this.props.dark : (this.state.d ?? !!this.props.dark); }
  fire(e, want) {
    const dark = this.isDark();
    if (want != null && want === dark) return;
    let x = e && e.clientX, y = e && e.clientY;
    if (!x && !y && e && e.currentTarget) { const r = e.currentTarget.getBoundingClientRect(); x = r.left + r.width / 2; y = r.top + r.height / 2; }
    if (this.props.onToggle) this.props.onToggle({ clientX: x, clientY: y });
    else this.setState({ d: !dark });
  }
  renderVals() {
    const v = this.props.variant || 'scene', d = this.isDark();
    return {
      isScene: v === 'scene', isLabel: v === 'label', isSeg: v === 'segmented', isIcon: v === 'icon',
      toggle: e => this.fire(e), pickLight: e => this.fire(e, false), pickDark: e => this.fire(e, true),
      checked: d ? 'true' : 'false', notChecked: d ? 'false' : 'true',
      aria: d ? 'Включить светлую тему' : 'Включить тёмную тему',
      dayOp: d ? 0 : 1, nightOp: d ? 1 : 0,
      sky: d ? '#1A1D2B' : '#8DB4D0', knobX: d ? '26px' : '0px', moonX: d ? '0%' : '105%',
      starsY: d ? '0px' : '-10px', cloudsY: d ? '14px' : '0px',
      knobShadow: d
        ? 'inset -1.5px -2px 4px rgba(0,0,0,.2), inset 1.5px 1.5px 2px rgba(255,255,255,.3), 0 1px 2px rgba(0,0,0,.45), 0 0 0 5px rgba(255,255,255,.07), 0 0 0 10px rgba(255,255,255,.045), 0 0 0 15px rgba(255,255,255,.025)'
        : 'inset -1.5px -2px 4px rgba(196,104,20,.5), inset 1.5px 1.5px 2px rgba(255,255,255,.5), 0 1px 2px rgba(0,0,0,.25), 0 0 0 5px rgba(255,255,255,.22), 0 0 0 10px rgba(255,255,255,.14), 0 0 0 15px rgba(255,255,255,.08)',
      lblKnobX: d ? '56px' : '0px', lblKnobBg: d ? 'var(--kz-ink,#151515)' : 'var(--kz-accent,#E0502E)', lblKnobFg: d ? 'var(--kz-paper,#F2EFE9)' : 'var(--kz-on-accent,#151515)',
      dayLblX: d ? '8px' : '0px', nightLblX: d ? '0px' : '-8px',
      sunT: d ? 'rotate(-90deg) scale(.4)' : 'none', moonT: d ? 'none' : 'rotate(90deg) scale(.4)',
      segX: d ? '34px' : '0px',
      segSunFg: d ? 'var(--kz-ink,#151515)' : 'var(--kz-paper,#F2EFE9)', segMoonFg: d ? 'var(--kz-paper,#F2EFE9)' : 'var(--kz-ink,#151515)',
      segSunOp: d ? 0.45 : 1, segMoonOp: d ? 1 : 0.45,
      maskId: this.uid, maskUrl: 'url(#' + this.uid + ')', maskT: d ? '0px, 0px' : '9px, -9px',
      coreS: d ? 1 : 0.5, raysT: d ? 'rotate(45deg) scale(.5)' : 'none'
    };
  }
}
</script>
</body>
</html>
